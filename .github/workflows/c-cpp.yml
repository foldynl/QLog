name: CI Linux

on:
  push:
    branches:
      - 'testing_*'
  pull_request:
    branches:
      - 'testing_*'
      - master
  workflow_dispatch:
    inputs:
      run_import_benchmark:
        description: Run the 50,000-contact ADI import benchmark
        type: boolean
        default: false

concurrency:
  group: ci-linux-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-build-qt5:
    name: Ubuntu CI QT5
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            run_tests: true
          - os: ubuntu-24.04
            run_tests: false

    runs-on: ${{ matrix.os }}

    steps:
    - name: Install dependencies
      run: |
         sudo apt-get update
         sudo apt-get -y install qtbase5-dev qtchooser qt5-qmake qtbase5-dev-tools libsqlite3-dev libhamlib++-dev libqt5charts5-dev qttools5-dev-tools libqt5keychain1 qt5keychain-dev qtwebengine5-dev build-essential libqt5serialport5-dev pkg-config libqt5websockets5-dev
    - name: Checkout code
      uses: actions/checkout@v5
    - name: configure
      run: qmake QLog.pro
    - name: make
      run: make -j"$(nproc)"
    - name: Configure tests
      if: matrix.run_tests
      run: |
        mkdir -p tests/build
        cd tests/build
        qmake ../tests.pro
    - name: Build and run tests
      if: matrix.run_tests
      working-directory: tests/build
      env:
        QT_QPA_PLATFORM: offscreen
        QLOG_RUN_ADI_IMPORT_BENCHMARK: ${{ inputs.run_import_benchmark && '1' || '0' }}
      run: make -j"$(nproc)" check

  ubuntu-build-qt6:
    name: Ubuntu CI QT6
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            run_tests: false
          - os: ubuntu-24.04
            run_tests: true
        
    runs-on: ${{ matrix.os }}

    steps:
    - name: Install dependencies
      run: |
         sudo apt-get update
         sudo apt-get -y install libhamlib-dev build-essential pkg-config qt6-base-dev qtkeychain-qt6-dev qt6-webengine-dev libqt6charts6-dev libqt6serialport6-dev libqt6webenginecore6-bin libqt6svg6-dev libgl-dev libqt6websockets6-dev
    - name: Checkout code
      uses: actions/checkout@v5
    - name: configure
      run: qmake6 QLog.pro
    - name: make
      run: make -j"$(nproc)"
    - name: Configure tests
      if: matrix.run_tests
      run: |
        mkdir -p tests/build
        cd tests/build
        qmake6 ../tests.pro
    - name: Build and run tests
      if: matrix.run_tests
      working-directory: tests/build
      env:
        QT_QPA_PLATFORM: offscreen
        QLOG_RUN_ADI_IMPORT_BENCHMARK: ${{ inputs.run_import_benchmark && '1' || '0' }}
      run: make -j"$(nproc)" check
