name: DEB and RPM Packages

on:
  workflow_dispatch:

concurrency:
  group: packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deb-package:
    name: DEB Package Build
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install tools and build dependencies
      run: |
        sudo apt-get update
        sudo apt-get -y install devscripts equivs dpkg-dev fakeroot lintian libconfig-model-dpkg-perl licensecheck
        sudo mk-build-deps --install --remove debian/control --tool "apt-get -y --no-install-recommends"

    - name: Check debian/copyright
      run: cme check dpkg-copyright

    - name: Build DEB package
      run: dpkg-buildpackage -b -us -uc -j4

    - name: Verify DEB was created
      run: ls -la ../qlog_*.deb

    - name: Run lintian
      run: lintian --no-tag-display-limit --fail-on error ../qlog_*.changes

    - name: Stage DEB artifact
      run: mv ../qlog_*.deb .

    - name: Upload DEB artifact
      uses: actions/upload-artifact@v6
      with:
        name: deb-package
        path: ${{ github.workspace }}/qlog_*.deb
        retention-days: 1

  deb-smoke-test:
    name: DEB Smoke Test
    needs: deb-package
    runs-on: ubuntu-24.04

    steps:
    - name: Download DEB artifact
      uses: actions/download-artifact@v7
      with:
        name: deb-package

    - name: Install and smoke test
      run: |
        sudo apt-get update
        sudo apt-get install -y ./qlog_*.deb
        QT_QPA_PLATFORM=offscreen qlog --help 2>&1 | grep -q "QLog Help"

  rpm-package:
    name: RPM Package Build
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Build RPM package
      run: CONTAINER_ENGINE=docker ./packaging/rpm/build-container.sh 43

    - name: Upload RPM artifact
      uses: actions/upload-artifact@v6
      with:
        name: rpm-package
        path: dist/rpm/fedora-43/x86_64/QLog-*.x86_64.rpm
        if-no-files-found: error
        retention-days: 1

  rpm-smoke-test:
    name: RPM Smoke Test
    needs: rpm-package
    runs-on: ubuntu-latest
    container:
      image: fedora:43

    steps:
    - name: Download RPM artifact
      uses: actions/download-artifact@v7
      with:
        name: rpm-package
        path: dist/rpm/fedora-43/x86_64

    - name: Install and smoke test
      run: |
        dnf install -y dist/rpm/fedora-43/x86_64/QLog-*.x86_64.rpm
        QT_QPA_PLATFORM=offscreen qlog --help 2>&1 | grep -q "QLog Help"
