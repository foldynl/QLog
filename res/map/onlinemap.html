<!DOCTYPE html>
<html>

<head>
  <title>Online Map</title>
  <meta charset="utf8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" integrity="sha512-xodZBNTC5n17Xt2atTPuE1HxjVMSvLVW9ocqUKLsCC5CXdbqCmblAshOMAS6/keqq/sMZMZ19scR4PsZChSR7A==" crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js" integrity="sha512-XQoYMqMTK8LvdxXYG3nZ448hOEQiglfqkJs1NOQV44cWnUrBc8PkAOcXy20w0vlaXaVUearIOBhiXZ5V3ynxwA==" crossorigin=""></script>
  <script src="https://foldynl.github.io/QLog/js/L.MaidenheadConfWorked.js"></script>
  <script src="https://foldynl.github.io/QLog/js/L.Terminator.js"></script>
  <script src="https://foldynl.github.io/QLog/js/heatmap.js"></script>
  <script src="https://foldynl.github.io/QLog/js/leaflet-heatmap.js"></script>
  <script src="https://unpkg.com/leaflet.geodesic@2.6.1/dist/leaflet.geodesic.umd.min.js"></script>
  <style>
    body {
      padding: 0;
      margin: 0;
      background: #f3f4f6;
    }
    html, body, #map {
      height: 100%;
    }
    body.qlog-map-dark {
      background: #454d55;
    }
    body.qlog-map-dark .leaflet-control-layers,
    body.qlog-map-dark .leaflet-bar a,
    body.qlog-map-dark .leaflet-control-attribution {
      background: rgba(70, 78, 87, 0.92);
      color: #f3f5f7;
      border-color: rgba(148, 156, 166, 0.58);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.18);
    }
    body.qlog-map-dark .leaflet-bar a {
      border-bottom-color: rgba(148, 156, 166, 0.58);
    }
    body.qlog-map-dark .leaflet-bar a:hover,
    body.qlog-map-dark .leaflet-control-layers-expanded {
      background: rgba(82, 91, 101, 0.96);
    }
    body.qlog-map-dark .leaflet-control-attribution a {
      color: #d6dbe0;
    }
    body.qlog-map-dark .leaflet-popup-content-wrapper,
    body.qlog-map-dark .leaflet-popup-tip {
      background: #4c5560;
      color: #eceff2;
    }
    .leaflet-tooltip {
        border: 0px;
        color: #232D45;
        box-shadow: none;
        margin: 0px !important;
        line-height: 10px;
        font-weight: 900;
      }
    .leaflet-tooltip-top:before,
    .leaflet-tooltip-bottom:before,
    .leaflet-tooltip-left:before,
    .leaflet-tooltip-right:before {
        border: none !important;
    }
    .leaflet-tooltip.muf-tooltip {
        border-radius: 20px;
        background-color: transparent;
        padding: 5px;
        font-weight: bold;
    }
    .leaflet-tooltip.chat-tooltip {
        border-radius: 20px;
        background-color: transparent;
        padding: 5px;
        font-weight: bold;
    }
    .leaflet-tooltip.wsjtx-tooltip {
        border-radius: 20px;
        background-color: transparent;
        padding: 5px;
        font-weight: bold;
    }
    .leaflet-tooltip.wsjtx-tooltip.fade-out75 {
        opacity: 0.75 !important; /* !important zajistí, že tato hodnota má přednost */
    }

    .leaflet-tooltip.wsjtx-tooltip.fade-out50 {
        opacity: 0.5 !important; /* !important zajistí, že tato hodnota má přednost */
    }

    .busy{
      position: fixed;
      inset: 0;
      background: rgba(255,255,255,0.65);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      z-index: 9999;
    }
    .busy.hidden{ display:none; }
    body.qlog-map-dark .busy {
      background: rgba(62, 70, 79, 0.46);
    }

    .spinner{
      width: 42px;
      height: 42px;
      border: 4px solid rgba(0,0,0,0.15);
      border-top-color: rgba(0,0,0,0.6);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }
    body.qlog-map-dark .spinner {
      border-color: rgba(255,255,255,0.18);
      border-top-color: rgba(255,255,255,0.72);
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .label{ margin-top: 10px; font: 14px sans-serif; color:#333; }
    body.qlog-map-dark .label{ color:#d7dce2; }

    .ant-azimuth-handle {
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid #2563eb;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.55);
      color: #2563eb;
      cursor: grab;
    }
    .ant-azimuth-handle svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-width: 1.8;
    }
    .ant-azimuth-handle.leaflet-drag-target {
      cursor: grabbing;
    }
    body.qlog-map-dark .ant-azimuth-handle {
      border-color: #8ab4f8;
      background: rgba(54, 64, 74, 0.96);
      color: #8ab4f8;
    }
    .ant-context-menu .leaflet-popup-content {
      margin: 4px;
    }
    .ant-context-menu button {
      display: block;
      width: 100%;
      padding: 6px 10px;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: inherit;
      cursor: pointer;
      text-align: left;
      white-space: nowrap;
    }
    .ant-context-menu button:not(:disabled):hover {
      background: rgba(0, 0, 0, 0.08);
    }
    .ant-context-menu button:disabled {
      cursor: default;
      opacity: 0.45;
    }
    .ant-context-menu-separator {
      margin: 3px 4px;
      border-top: 1px solid rgba(0, 0, 0, 0.16);
    }
    body.qlog-map-dark .ant-context-menu .leaflet-popup-content-wrapper,
    body.qlog-map-dark .ant-context-menu .leaflet-popup-tip {
      background: #36404a;
      color: #e8eaed;
    }
    body.qlog-map-dark .ant-context-menu button:not(:disabled):hover {
      background: rgba(255, 255, 255, 0.1);
    }
    body.qlog-map-dark .ant-context-menu-separator {
      border-top-color: rgba(255, 255, 255, 0.2);
    }

  </style>
</head>

<body>

  <div id="map"></div>

  <div id="busyOverlay" class="busy hidden">
    <div class="spinner"></div>
    <div class="label">Rendering…</div>
  </div>

  <script>

    var grids_worked = [];    //field of Grids used for rendering Worked Grids
    var grids_confirmed = []; //field of Grids used for rendering Confirmed Grids
    var mylocations = [];     //field of My Locations
    var locations = [];
    var staticMapTime = null;

    var map = L.map('map', {center: [0,0], zoom: 2, minZoom: 1});
    var layerControl = null;
    var mapBridge = null;
    const qlogLayerStateKeys = new Map();
    let qlogLayerStateBridgeConnected = false;

    function mapLayerByKey(key) {
      return window[key] || null;
    }

    function sendToQt(method) {
      if (!window.mapBridge || typeof window.mapBridge[method] !== 'function')
        return;

      window.mapBridge[method].apply(window.mapBridge, Array.prototype.slice.call(arguments, 1));
    }

    function setQLogLayerVisibility(key, visible) {
      const layer = mapLayerByKey(key);
      if (!layer)
        return;

      if (visible)
        map.addLayer(layer);
      else
        map.removeLayer(layer);
    }

    function restoreQLogLayerStates(states) {
      states.forEach(function(state) {
        setQLogLayerVisibility(state.key, state.visible);
      });
    }

    function configureLayerControl(layers) {
      const overlays = {};
      qlogLayerStateKeys.clear();

      layers.forEach(function(layerSpec) {
        const layer = mapLayerByKey(layerSpec.key);
        if (!layer)
          return;

        overlays[layerSpec.label] = layer;
        qlogLayerStateKeys.set(layer, layerSpec.key);
      });

      if (layerControl)
        map.removeControl(layerControl);

      layerControl = new L.Control.Layers(null, overlays, {}).addTo(map);
    }

    function handleQLogLayerStateChanged(layer, state) {
      const key = qlogLayerStateKeys.get(layer);
      if (!key)
        return;

      sendToQt('handleLayerSelectionChanged', key, state);
    }

    function connectQtMapBridge(handler) {
      window.mapBridge = handler;

      if (qlogLayerStateBridgeConnected)
        return;

      map.on('overlayadd', function(e) {
        handleQLogLayerStateChanged(e.layer, 'on');
      });
      map.on('overlayremove', function(e) {
        handleQLogLayerStateChanged(e.layer, 'off');
      });
      qlogLayerStateBridgeConnected = true;
    }

    map.createPane('lowestPane');
    map.getPane('lowestPane').style.zIndex = 200;
    map.getPane('lowestPane').style.pointerEvents = 'none';


    // green Icon definition. It is usually used for confirmed QSOs
    const greenIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.7.1/dist/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });
    const greenIconSmall = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-green.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.7.1/dist/images/marker-shadow.png',
      iconSize: [14, 23],
      iconAnchor: [7, 23],
      popupAnchor: [1, -18],
      shadowSize: [23, 23]
    });

    // yellow Icon definition. It is usually used for generic QSOs or generic point
    const yellowIcon = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-2x-gold.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.7.1/dist/images/marker-shadow.png',
      iconSize: [25, 41],
      iconAnchor: [12, 41],
      popupAnchor: [1, -34],
      shadowSize: [41, 41]
    });

    const yellowIconSmall = new L.Icon({
      iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-gold.png',
      shadowUrl: 'https://unpkg.com/leaflet@1.7.1/dist/images/marker-shadow.png',
      iconSize: [14, 23],
      iconAnchor: [7, 23],
      popupAnchor: [1, -18],
      shadowSize: [23, 23]
    });

    // home Icon definition. It is usually used for own location
    const homeIcon = new L.Icon({
      iconUrl: 'https://img.icons8.com/officel/30/000000/radio-tower.png',
      iconSize: [30, 30],
      iconAnchor: [15, 25],
      popupAnchor: [1, -14]
    });

    const mapIcons = {
      greenIcon: greenIcon,
      greenIconSmall: greenIconSmall,
      yellowIcon: yellowIcon,
      yellowIconSmall: yellowIconSmall,
      homeIcon: homeIcon
    };

    const fastMarkerThreshold = 2000;
    var fastMarkersLayer = null;
    const fastMarkerImages = {};

    function resolveIcon(icon) {
      return mapIcons[icon] || null;
    }

    function normalizePoint(point) {
      if (Array.isArray(point)) {
        return {
          label: point[0],
          lat: point[1],
          lng: point[2],
          icon: point[3]
        };
      }

      return point;
    }

    function wrappedLongitude(longitude) {
      return longitude < 0 ? longitude + 360 : longitude - 360;
    }

    function markerOptions(point) {
      const icon = resolveIcon(point.icon);
      return icon ? {icon: icon} : {};
    }

    function fastMarkerImage(url, onLoad) {
      if (!url)
        return null;

      if (fastMarkerImages[url]) {
        if (onLoad && !fastMarkerImages[url].loaded)
          fastMarkerImages[url].callbacks.push(onLoad);
        return fastMarkerImages[url];
      }

      const image = new Image();
      fastMarkerImages[url] = { image: image, loaded: false, callbacks: onLoad ? [onLoad] : [] };
      image.onload = function() {
        const entry = fastMarkerImages[url];
        entry.loaded = true;
        const callbacks = entry.callbacks;
        entry.callbacks = [];
        callbacks.forEach(callback => callback());
      };
      image.src = url;

      return fastMarkerImages[url];
    }

    function fastMarkerPoint(point) {
      const mapPoint = normalizePoint(point);
      const icon = resolveIcon(mapPoint.icon);
      if (!icon)
        return mapPoint;

      const iconOptions = icon.options || {};
      const iconSize = iconOptions.iconSize || [25, 41];
      mapPoint.iconOptions = iconOptions;
      mapPoint.iconSize = iconSize;
      mapPoint.iconAnchor = iconOptions.iconAnchor || [Math.floor(iconSize[0] / 2), iconSize[1]];

      return mapPoint;
    }

    const FastMarkerLayer = L.Layer.extend({
      initialize: function(points) {
        this.points = points.map(fastMarkerPoint);
        this.pendingImageUrls = {};
      },

      onAdd: function(map) {
        this.map = map;
        this.shadowCanvas = L.DomUtil.create('canvas', 'qlog-fast-marker-shadows');
        this.iconCanvas = L.DomUtil.create('canvas', 'qlog-fast-markers');
        this.shadowCanvas.style.pointerEvents = 'none';
        this.iconCanvas.style.pointerEvents = 'none';
        map.getPane('shadowPane').appendChild(this.shadowCanvas);
        map.getPane('markerPane').appendChild(this.iconCanvas);
        map.on('moveend zoomend resize', this.reset, this);
        map.on('click', this.handleClick, this);
        this.reset();
      },

      onRemove: function(map) {
        map.off('moveend zoomend resize', this.reset, this);
        map.off('click', this.handleClick, this);
        L.DomUtil.remove(this.shadowCanvas);
        L.DomUtil.remove(this.iconCanvas);
        this.shadowCanvas = null;
        this.iconCanvas = null;
        this.map = null;
      },

      reset: function() {
        if (!this.map || !this.shadowCanvas || !this.iconCanvas)
          return;

        const size = this.map.getSize();
        const topLeft = this.map.containerPointToLayerPoint([0, 0]);
        [this.shadowCanvas, this.iconCanvas].forEach(canvas => {
          L.DomUtil.setPosition(canvas, topLeft);
          canvas.width = size.x;
          canvas.height = size.y;
        });
        this.draw();
      },

      drawMarkerImage: function(ctx, iconOptions, markerPoint, imageKey, sizeKey, anchorKey, drawnKeys) {
        const url = iconOptions[imageKey];
        const size = iconOptions[sizeKey];
        const anchor = iconOptions[anchorKey] || iconOptions.iconAnchor;
        if (!url || !size || !anchor)
          return;

        const imageEntry = fastMarkerImage(url, this.pendingImageUrls[url] ? null : () => {
          delete this.pendingImageUrls[url];
          this.draw();
        });
        if (!imageEntry || !imageEntry.loaded) {
          this.pendingImageUrls[url] = true;
          return;
        }

        const x = markerPoint.x - anchor[0];
        const y = markerPoint.y - anchor[1];

        if (drawnKeys) {
          const key = [url, size[0], size[1], Math.round(x), Math.round(y)].join('|');
          if (drawnKeys[key])
            return;
          drawnKeys[key] = true;
        }

        ctx.drawImage(imageEntry.image, x, y, size[0], size[1]);
      },

      visiblePoints: function() {
        const size = this.map.getSize();
        const visible = [];

        this.points.forEach(point => {
          if (!point.iconOptions)
            return;

          const markerPoint = this.map.latLngToContainerPoint([point.lat, point.lng]);
          if (markerPoint.x < -point.iconSize[0]
              || markerPoint.y < -point.iconSize[1]
              || markerPoint.x > size.x + point.iconSize[0]
              || markerPoint.y > size.y + point.iconSize[1])
            return;

          visible.push({
            point: point,
            markerPoint: markerPoint
          });
        });

        return visible;
      },

      draw: function() {
        if (!this.map || !this.shadowCanvas || !this.iconCanvas)
          return;

        const shadowCtx = this.shadowCanvas.getContext('2d');
        const iconCtx = this.iconCanvas.getContext('2d');
        const size = this.map.getSize();
        shadowCtx.clearRect(0, 0, size.x, size.y);
        iconCtx.clearRect(0, 0, size.x, size.y);
        const visible = this.visiblePoints();
        const drawnShadows = {};

        visible.forEach(item => {
          this.drawMarkerImage(shadowCtx, item.point.iconOptions, item.markerPoint,
                               'shadowUrl', 'shadowSize', 'shadowAnchor', drawnShadows);
        });

        visible.forEach(item => {
          this.drawMarkerImage(iconCtx, item.point.iconOptions, item.markerPoint,
                               'iconUrl', 'iconSize', 'iconAnchor');
        });
      },

      handleClick: function(event) {
        const clickPoint = this.map.latLngToContainerPoint(event.latlng);
        let bestPoint = null;
        let bestDistance = Number.MAX_VALUE;

        this.points.forEach(point => {
          if (!point.iconOptions)
            return;

          const markerPoint = this.map.latLngToContainerPoint([point.lat, point.lng]);
          const left = markerPoint.x - point.iconAnchor[0];
          const top = markerPoint.y - point.iconAnchor[1];
          const right = left + point.iconSize[0];
          const bottom = top + point.iconSize[1];

          if (clickPoint.x < left || clickPoint.x > right
              || clickPoint.y < top || clickPoint.y > bottom)
            return;

          const dx = markerPoint.x - clickPoint.x;
          const dy = markerPoint.y - clickPoint.y;
          const distance = dx * dx + dy * dy;
          if (distance < bestDistance) {
            bestDistance = distance;
            bestPoint = point;
          }
        });

        if (bestPoint) {
          L.popup()
            .setLatLng([bestPoint.lat, bestPoint.lng])
            .setContent(bestPoint.label)
            .openOn(this.map);
        }
      }
    });

    function clearFastMarkerLayer() {
      if (!fastMarkersLayer)
        return;

      map.removeLayer(fastMarkersLayer);
      fastMarkersLayer = null;
    }

    function normalizePath(path) {
      if (Array.isArray(path)) {
        return {
          from: {lat: path[0], lng: path[1]},
          to: {lat: path[2], lng: path[3]}
        };
      }

      return path;
    }


    var baseMapLayer = null;
    const mapLanguage = new URLSearchParams(window.location.search).get('language') || 'en';

    function rasterMapUrl(language) {
      if (language === 'de')
        return 'https://tile.openstreetmap.de/{z}/{x}/{y}.png';
      if (language === 'fr')
        return 'https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png';

      return 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
    }

    function useRasterBaseMap() {
      if (baseMapLayer && typeof baseMapLayer.getMaplibreMap !== 'function')
        return;

      const failedBaseMapLayer = baseMapLayer;
      baseMapLayer = null;
      if (failedBaseMapLayer && map.hasLayer(failedBaseMapLayer))
        map.removeLayer(failedBaseMapLayer);

      baseMapLayer = L.tileLayer(rasterMapUrl(mapLanguage), {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(map);
    }

    function expressionUsesMapName(expression) {
      if (!Array.isArray(expression))
        return false;

      if (expression[0] === 'get' && typeof expression[1] === 'string')
        return expression[1] === 'name'
            || expression[1] === 'name_en'
            || expression[1].indexOf('name:') === 0;

      return expression.some(expressionUsesMapName);
    }

    function applyMapLanguage(maplibreMap) {
      if (mapLanguage === 'en')
        return;

      const style = maplibreMap.getStyle();
      if (!style || !style.layers)
        return;

      style.layers.forEach(function(layer) {
        const textField = layer.layout && layer.layout['text-field'];
        if (layer.type === 'symbol' && expressionUsesMapName(textField))
          maplibreMap.setLayoutProperty(layer.id, 'text-field', [
            'coalesce',
            ['get', 'name:' + mapLanguage],
            textField
          ]);
      });
    }

    function loadExternalStyle(url, integrity) {
      return new Promise(function(resolve, reject) {
        const resource = document.createElement('link');
        resource.rel = 'stylesheet';
        resource.href = url;
        resource.integrity = integrity;
        resource.crossOrigin = 'anonymous';
        resource.onload = resolve;
        resource.onerror = reject;
        document.head.appendChild(resource);
      });
    }

    function loadExternalScript(url, integrity) {
      return new Promise(function(resolve, reject) {
        const resource = document.createElement('script');
        resource.src = url;
        resource.integrity = integrity;
        resource.crossOrigin = 'anonymous';
        resource.async = true;
        resource.onload = resolve;
        resource.onerror = reject;
        document.head.appendChild(resource);
      });
    }

    function loadMapLibre() {
      const resources = Promise.all([
        loadExternalStyle(
          'https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.css',
          'sha256-XSFr7LOcuEhLTCjxEDKGYWrybnxvmEbq1vVebzaOdGQ='
        ),
        loadExternalScript(
          'https://unpkg.com/maplibre-gl@2.4.0/dist/maplibre-gl.js',
          'sha256-+w4eOjx0PG0PkY759djLZBB4sF2VoKuyJfsQ67pUGYk='
        ).then(function() {
          return loadExternalScript(
            'https://unpkg.com/@maplibre/maplibre-gl-leaflet@0.0.20/leaflet-maplibre-gl.js',
            'sha256-/LD//86ABfi3cF7izoYCBVoAzxJXxqlUHKk57MVWjsY='
          );
        })
      ]);

      return new Promise(function(resolve, reject) {
        const timer = setTimeout(function() {
          reject(new Error('MapLibre resources timed out'));
        }, 10000);

        resources.then(function() {
          clearTimeout(timer);
          resolve();
        }, function(error) {
          clearTimeout(timer);
          reject(error);
        });
      });
    }

    function useVectorBaseMap() {
      let vectorBaseMapLayer = null;

      try {
        if (!window.maplibregl
            || typeof maplibregl.supported !== 'function'
            || !maplibregl.supported()
            || typeof L.maplibreGL !== 'function')
          return;

        const rasterBaseMapLayer = baseMapLayer;
        vectorBaseMapLayer = L.maplibreGL({
          style: 'https://tiles.openfreemap.org/styles/liberty',
          attribution: '<a href="https://openmaptiles.org/">&copy; OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
        });
        vectorBaseMapLayer.addTo(map);
        vectorBaseMapLayer.getContainer().style.opacity = '0';

        const maplibreMap = vectorBaseMapLayer.getMaplibreMap();
        let vectorMapActive = false;
        let vectorMapErrorCount = 0;
        let vectorMapErrorTimer = null;
        let vectorMapLoadTimer = null;

        function clearVectorMapErrors() {
          vectorMapErrorCount = 0;
          clearTimeout(vectorMapErrorTimer);
          vectorMapErrorTimer = null;
        }

        function fallbackToRaster() {
          clearTimeout(vectorMapLoadTimer);
          clearVectorMapErrors();

          if (map.hasLayer(vectorBaseMapLayer))
            map.removeLayer(vectorBaseMapLayer);
          if (baseMapLayer === vectorBaseMapLayer)
            baseMapLayer = null;
          useRasterBaseMap();
        }

        function activateVectorMap() {
          if (baseMapLayer !== rasterBaseMapLayer || !map.hasLayer(vectorBaseMapLayer)) {
            fallbackToRaster();
            return;
          }

          clearTimeout(vectorMapLoadTimer);
          vectorMapActive = true;
          baseMapLayer = vectorBaseMapLayer;
          vectorBaseMapLayer.getContainer().style.opacity = '';
          if (rasterBaseMapLayer && map.hasLayer(rasterBaseMapLayer))
            map.removeLayer(rasterBaseMapLayer);
        }

        vectorMapLoadTimer = setTimeout(function() {
          if (!vectorMapActive)

        maplibreMap.on('error', function(event) {
          const message = event && event.error ? String(event.error.message || event.error) : '';
          if (/webgl|graphics context/i.test(message))
            return fallbackToRaster();

          if (!vectorMapActive)

          ++vectorMapErrorCount;

            const hasRepeatedErrors = vectorMapErrorCount >= 3;

            if (hasRepeatedErrors && baseMapLayer === vectorBaseMapLayer)

    // function computes a destination point based on distance and azimuth
    function beamEndPosition(fromPoint, distance, azimuth) {
        const M_PI = Math.PI;
        const d = distance / 6371;
        let lat1 = fromPoint.lat * M_PI / 180;
        let lon1 = fromPoint.lng * M_PI / 180;
        const alpha1 = azimuth * M_PI / 180;

        let lat2 = Math.asin(Math.sin(lat1) * Math.cos(d) + Math.cos(lat1) * Math.sin(d) * Math.cos(alpha1));
        let lon2 = lon1 + Math.atan2(Math.sin(alpha1) * Math.sin(d) * Math.cos(lat1), Math.cos(d) - Math.sin(lat1) * Math.sin(lat2));

        let newLat = lat2 * 180 / M_PI;
        return {"lat": newLat, "lng": (lon2 * 180 / M_PI)};
    }

    function visibleAntPathDistance(fromPoint) {
        const bounds = map.getBounds();
        return Math.max(...[bounds.getNorthWest(), bounds.getNorthEast(),
                            bounds.getSouthWest(), bounds.getSouthEast()]
                          .map(corner => map.distance(fromPoint, corner))) / 1000;
    }

    function antPathDistance() {
        return qsoPathEnd
               ? map.distance(antPath.from, qsoPathEnd) / 1000
               : visibleAntPathDistance(antPath.from);
    }

    function normalizeAzimuth(azimuth) {
        return (azimuth % 360 + 360) % 360;
    }

    function bearingTo(from, to) {
        const lat1 = from.lat * Math.PI / 180;
        const lat2 = to.lat * Math.PI / 180;
        const longitudeDifference = (to.lng - from.lng) * Math.PI / 180;
        const y = Math.sin(longitudeDifference) * Math.cos(lat2);
        const x = Math.cos(lat1) * Math.sin(lat2)
                  - Math.sin(lat1) * Math.cos(lat2) * Math.cos(longitudeDifference);
        return normalizeAzimuth(Math.atan2(y, x) * 180 / Math.PI);
    }

    function antViewportBounds() {
        const size = map.getSize();
        const margin = antHandleSize / 2;
        return L.bounds(L.point(margin, margin),
                        L.point(size.x - margin, size.y - margin));
    }

    function antPositionIsVisible(position) {
        return antViewportBounds().contains(
            map.latLngToContainerPoint(position));
    }

    function visibleDistanceRange(azimuth, preferredDistance) {
        const maximumDistance = antPathDistance();
        const viewport = antViewportBounds();
        const segmentCount = 32;
        const ranges = [];
        let previousDistance = 0;
        let previousPoint = map.latLngToContainerPoint(antPath.from);

        for (let i = 1; i <= segmentCount; ++i) {
            const distance = maximumDistance * i / segmentCount;
            const point = map.latLngToContainerPoint(
                beamEndPosition(antPath.from, distance, azimuth));
            const clipped = L.LineUtil.clipSegment(previousPoint, point,
                                                   viewport, false);
            if (clipped) {
                const segmentLength = previousPoint.distanceTo(point);
                const distancePerPixel = segmentLength > 0
                    ? (distance - previousDistance) / segmentLength : 0;
                const start = previousDistance
                    + previousPoint.distanceTo(clipped[0]) * distancePerPixel;
                const end = previousDistance
                    + previousPoint.distanceTo(clipped[1]) * distancePerPixel;
                const lastRange = ranges[ranges.length - 1];

                if (lastRange && start <= lastRange.end + 0.001)
                    lastRange.end = Math.max(lastRange.end, end);
                else
                    ranges.push({start: start, end: end});
            }
            previousDistance = distance;
            previousPoint = point;
        }

        if (!ranges.length)
            return null;

        if (!Number.isFinite(preferredDistance))
            return ranges.reduce((longest, range) =>
                range.end - range.start > longest.end - longest.start
                    ? range : longest);

        const distanceFrom = range => Math.max(range.start - preferredDistance,
                                               preferredDistance - range.end,
                                               0);
        return ranges.reduce((nearest, range) =>
            distanceFrom(range) < distanceFrom(nearest) ? range : nearest);
    }

    function updateAntTargetPosition() {
        if (!antPath || antHandleDragging)
            return;

        const azimuth = antTarget
            ? antTarget.azimuth : normalizeAzimuth(antPath.azimuth);
        let position = antTarget && antPositionIsVisible(antTarget.position)
            ? antTarget.position : null;

        if (!position) {
            const preferredDistance = antTarget ? antTarget.distance : null;
            const visibleRange = visibleDistanceRange(azimuth, preferredDistance);
            if (visibleRange) {
                const distance = antTarget
                    ? Math.max(visibleRange.start,
                               Math.min(antTarget.distance, visibleRange.end))
                    : visibleRange.start
                      + (visibleRange.end - visibleRange.start) * 0.55;
                position = beamEndPosition(antPath.from, distance, azimuth);
            }
        }

        if (!position) {
            antPathLayer.removeLayer(antAzimuthHandle);
            return;
        }

        antAzimuthHandle.setLatLng(position);
        if (!antPathLayer.hasLayer(antAzimuthHandle))
            antPathLayer.addLayer(antAzimuthHandle);
    }

    function setAntBeam(geodesic1, geodesic2, azimuth) {

            const distance = antPathDistance();
            line1 = [antPath.from, beamEndPosition(antPath.from, distance,
                                                   azimuth - (antPath.angle/2))];
            line2 = [antPath.from, beamEndPosition(antPath.from, distance,
                                                   azimuth + (antPath.angle/2))];

        geodesic1.setLatLngs(line1);
        geodesic2.setLatLngs(line2);
    }

    // compute 3-color gradient
    function colorGradient(fadeFraction, rgbColor1, rgbColor2, rgbColor3) {
      let color1 = rgbColor1;
      let color2 = rgbColor2;
      let fade = fadeFraction;

      if (rgbColor3) {
        fade = fade * 2;

        if (fade >= 1) {
          fade -= 1;
          color1 = rgbColor2;
          color2 = rgbColor3;
        }
      }

      let diffRed = color2.red - color1.red;
      let diffGreen = color2.green - color1.green;
      let diffBlue = color2.blue - color1.blue;

      let gradient = {
        red: parseInt(Math.floor(color1.red + (diffRed * fade)), 10),
        green: parseInt(Math.floor(color1.green + (diffGreen * fade)), 10),
        blue: parseInt(Math.floor(color1.blue + (diffBlue * fade)), 10),
      };

      return 'rgb(' + gradient.red + ',' + gradient.green + ',' + gradient.blue + ')';
    }

    var mufLayer = L.layerGroup();

    // Render MUF points
    function drawMuf(points) {

       // definition of the color used to render the MUF
       // LOW Color for low frequency
       const lowColor = {
            red: 0,
            green: 131,
            blue: 255
       };

       // MEDIUM Color for frequencies in the middle
       const mediumColor = {
           red: 255,
           green: 162,
           blue: 0
       };

       // HIGH Color for high frequency
       const highColor = {
           red: 255,
           green: 255,
           blue: 0
       };

       mufLayer.clearLayers();
       points.forEach(function(point) {
            const mapPoint = normalizePoint(point);
            let marker = new L.marker([mapPoint.lat, mapPoint.lng], {opacity: 0.001 });
            marker.bindTooltip(mapPoint.label, {permanent: true, direction : 'bottom', offset: [-16, 8], className: 'muf-tooltip' });
            // color gradient is calculated for number interval 0 - 1.
            // MUF value is a fgrequency. Threfore is it needed to recalculate Freq to interval 0 - 1
            // QLog currently recalculate the interval 0 - 50 MHz. This is due to the fact that
            // most of the values move in this interval and it is easy to see the individual frequency ranges
            const oldValue = parseFloat(mapPoint.label);
            const oldMin = 0; const oldMax = 50; //frequency input range (0 - 50MHz)
            const newMin = 0; const newMax = 1; //mapped to range 0 - 1
            const newValue = (oldValue - oldMin) / (oldMax - oldMin) * (newMax - newMin) + newMin;
            const color = colorGradient(newValue, lowColor, mediumColor, highColor);

            marker.getTooltip().setContent(`<div style="background-color: ${color};border-radius: 20px;padding: 5px;font-weight: bold;">${marker.getTooltip().getContent()}</div>`);
            mufLayer.addLayer(marker);
         });
     }

    // render IBP Beacon Point
    function beaconPoint(beacon, color) {
       let pointColor = color;
       if ( !beacon.active ) {
         pointColor = 'red';
       }

       let marker = new L.marker([beacon.lat, beacon.lon], {opacity: 0.001 });
       let mirrorLon = beacon.lon - 360;
       if ( mirrorLon < -360 ) {
          mirrorLon = beacon.lon + 360;
       }
       let markerMirror = new L.marker([beacon.lat, mirrorLon], {opacity: 0.001 });
       marker.bindTooltip(beacon.callsign, {permanent: true, direction : 'bottom', offset: [-16, 8], className: 'muf-tooltip' });
       marker.on('dblclick', IBPCallsignPressed);
       marker.callsign = beacon.callsign;
       markerMirror.bindTooltip(beacon.callsign, {permanent: true, direction : 'bottom', offset: [-16, 8], className: 'muf-tooltip' });
       markerMirror.on('dblclick', IBPCallsignPressed);
       markerMirror.callsign = beacon.callsign;
       marker.getTooltip().setContent(`<div style="background-color: ${pointColor};border-radius: 20px;padding: 5px;font-weight: bold;">${marker.getTooltip().getContent()}</div>`);
       markerMirror.getTooltip().setContent(`<div style="background-color: ${pointColor};border-radius: 20px;padding: 5px;font-weight: bold;">${markerMirror.getTooltip().getContent()}</div>`);
       IBPLayer.addLayer(marker);
       IBPLayer.addLayer(markerMirror);
    }

    // Update IBP Beacon Points
    function updateBeacon() {

       const currentBandIndex = ibpBands.findIndex(object => {return object.name === currentMapBand;});

       if ( currentBandIndex == -1 || ibpBeacons.length == 0 ) {
           IBPLayer.clearLayers();
           return;
       }

       let today = new Date();
       let n = Math.floor(today.getTime()/10000) % ibpBeacons.length;
       let currentStationIndex = (ibpBeacons.length + n - currentBandIndex) % ibpBeacons.length;
       let nextStationIndex = (ibpBeacons.length + 1 + n - currentBandIndex) % ibpBeacons.length;

       if ( currentStationIndex == prevStationIndex ) {
           return;
       }

       IBPLayer.clearLayers();

       prevStationIndex = currentStationIndex;

       // show current
       let b = ibpBeacons[currentStationIndex];
       beaconPoint(b, '#FFFF33');

       // show next
       b = ibpBeacons[nextStationIndex];
       beaconPoint(b, '#1AA260');
    }

    var chatStationsLayer = L.layerGroup().addTo(map);

    function chatCallsignPressed(e) {
       sendToQt('chatCallsignClicked', this.callsign);
    }

    // generic function to render the third layer of the points
    // It is usually used to render Chat Stations
    function drawPointsGroup3(points) {
       chatStationsLayer.clearLayers();
       points.forEach(function(point) {
          const mapPoint = normalizePoint(point);
          [mapPoint.lng, wrappedLongitude(mapPoint.lng)].forEach(function(longitude) {
             let marker = new L.marker([mapPoint.lat, longitude], {opacity: 0.001 });
             marker.bindTooltip(mapPoint.label, {pane: 'lowestPane', permanent: true, direction : 'bottom', offset: [-16, 8], className: 'chat-tooltip' });
             marker.on('dblclick', chatCallsignPressed);
             marker.callsign = mapPoint.label;
             marker.getTooltip().setContent(`<div style="background-color: aqua;border-radius: 20px;padding: 5px;font-weight: bold;">${marker.getTooltip().getContent()}</div>`);
             chatStationsLayer.addLayer(marker);
          });
       });
    }

    setInterval(function(){updateBeacon()}, 250);

    function wsjtxCallsignPressed(e) {
       sendToQt('wsjtxCallsignClicked', this.callsign);
    }

    var wsjtxStationsLayer = L.layerGroup();

    const heardMeFadedOpacity = 0.5;
    const heardMeSpots = new Map();
    var currentHeardMeDisplayGroup = "PSK";
    var heardMeLayer = L.layerGroup();

    function setHeardMeMode(mode) {
        const normalizedMode = String(mode || '').trim().toUpperCase();
        currentHeardMeDisplayGroup = normalizedMode === 'CW' || normalizedMode === 'RTTY'
                                    ? normalizedMode : 'PSK';
        refreshHeardMeLayer();
    }

    function isHeardMeSpotVisible(spot) {
        return spot.band === currentMapBand
            && spot.displayGroup === currentHeardMeDisplayGroup;
    }

    function heardMeLabel(spot) {
        const label = document.createElement('span');
        const callsign = document.createElement('strong');
        callsign.textContent = spot.callsign;
        label.appendChild(callsign);
        label.appendChild(document.createTextNode(` · ${spot.report} dB`));
        return label;
    }

    function addHeardMeSpotMarkers(spot, longitude, ageOpacity) {
        if (spot.halo) {
            const haloOutline = L.circleMarker([spot.lat, longitude], {
                radius: 9,
                color: '#000000',
                weight: 6,
                opacity: 0.65 * ageOpacity,
                fill: false,
                interactive: false
            });
            const halo = L.circleMarker([spot.lat, longitude], {
                radius: 9,
                color: spot.color,
                weight: 4,
                opacity: spot.opacity * ageOpacity,
                fill: false,
                interactive: false
            });
            heardMeLayer.addLayer(haloOutline);
            heardMeLayer.addLayer(halo);
        }

        const marker = L.circleMarker([spot.lat, longitude], {
            radius: 6,
            color: '#000000',
            weight: 1,
            stroke: !spot.halo,
            fillColor: spot.color,
            opacity: ageOpacity,
            fillOpacity: spot.opacity * ageOpacity
        });
        marker.bindPopup(heardMeLabel(spot));
        heardMeLayer.addLayer(marker);

        const center = L.circleMarker([spot.lat, longitude], {
            radius: 2,
            stroke: false,
            fillColor: '#000000',
            fillOpacity: ageOpacity,
            interactive: false
        });
        heardMeLayer.addLayer(center);
    }

    function refreshHeardMeLayer() {
        heardMeLayer.clearLayers();

        heardMeSpots.forEach(function(spot) {
            if (!isHeardMeSpotVisible(spot))
                return;

            const ageOpacity = spot.faded ? heardMeFadedOpacity : 1.0;
            addHeardMeSpotMarkers(spot, spot.lng, ageOpacity);
            addHeardMeSpotMarkers(spot, wrappedLongitude(spot.lng), ageOpacity);
        });
    }

    function clearHeardMeSpotTimers(spot) {
        clearTimeout(spot.fadeTimeoutId);
        clearTimeout(spot.removeTimeoutId);
    }

    function clearHeardMeSpots() {
        heardMeSpots.forEach(function(spot) {
            clearHeardMeSpotTimers(spot);
        });
        heardMeSpots.clear();
        heardMeLayer.clearLayers();
    }

    function addHeardMePoint(point, report, band, displayGroup, color, opacity, halo) {
        const mapPoint = normalizePoint(point);
        const callsign = String(mapPoint.label || '').trim().toUpperCase();
        const spotBand = String(band || '');
        const spotDisplayGroup = String(displayGroup || '').trim().toUpperCase();

        if (!callsign || !spotBand || !spotDisplayGroup)
            return;

        const key = `${spotBand}\n${spotDisplayGroup}\n${callsign}`;
        const previousSpot = heardMeSpots.get(key);
        if (previousSpot)
            clearHeardMeSpotTimers(previousSpot);

        const pskReporterSpot = spotDisplayGroup === 'PSK';
        const fadeAfterMs = (pskReporterSpot ? 30 : 5) * 60 * 1000;
        const removeAfterMs = (pskReporterSpot ? 45 : 10) * 60 * 1000;

        const spot = {
            callsign: callsign,
            report: report,
            band: spotBand,
            displayGroup: spotDisplayGroup,
            color: color,
            opacity: opacity,
            halo: halo,
            lat: mapPoint.lat,
            lng: mapPoint.lng,
            faded: false,
            fadeTimeoutId: null,
            removeTimeoutId: null
        };

        spot.fadeTimeoutId = setTimeout(function() {
            if (heardMeSpots.get(key) !== spot)
                return;

            spot.faded = true;
            if (isHeardMeSpotVisible(spot))
                refreshHeardMeLayer();
        }, fadeAfterMs);

        spot.removeTimeoutId = setTimeout(function() {
            if (heardMeSpots.get(key) !== spot)
                return;

            heardMeSpots.delete(key);
            if (isHeardMeSpotVisible(spot))
                refreshHeardMeLayer();
        }, removeAfterMs);

        heardMeSpots.set(key, spot);
        if (isHeardMeSpotVisible(spot))
            refreshHeardMeLayer();
    }

    // this function show WSJTX spots
    function addWSJTXSpot(point, color, textColor, halo) {
        const spot = normalizePoint(point);
        const fadeSchedule = [
            { timeout: 30000, className: 'fade-out75' },
            { timeout: 45000, className: 'fade-out50' },
        ];
        const haloStyle = halo
            ? `box-shadow:0 0 0 1px #000000,0 0 0 5px ${color},0 0 0 6px rgba(0,0,0,0.65);`
            : '';

        const tooltipHTML = content =>
            `<div style="background-color:${color};color:${textColor};border-radius:20px;padding:5px;font-weight:bold;${haloStyle}">${content}</div>`;

        function createSpotMarker(latitude, longitude) {
            const marker = new L.marker([latitude, longitude], { opacity: 0.001 });
            marker.callsign = spot.label;

            marker.bindTooltip(spot.label, {
                pane: 'lowestPane',
                permanent: true,
                direction: 'bottom',
                offset: [-16, 8],
                className: 'wsjtx-tooltip'
            });

            marker.on('dblclick', wsjtxCallsignPressed);

            const tooltip = marker.getTooltip();
            tooltip.setContent(tooltipHTML(tooltip.getContent()));

            return marker;
        }

        function fadeSpotMarker(marker, className) {
            const tooltip = marker.getTooltip();
            tooltip.options.className = `wsjtx-tooltip ${className}`;

            const element = tooltip.getElement();
            if (element)
                element.classList.add(className);
        }

        // the main marker
        const marker = createSpotMarker(spot.lat, spot.lng);

        // mirror marker
        const mirrorLon = spot.lng >= 0 ? spot.lng - 360 : spot.lng + 360;
        const markerMirror = createSpotMarker(spot.lat, mirrorLon);

        wsjtxStationsLayer.addLayer(marker);
        wsjtxStationsLayer.addLayer(markerMirror);

        fadeSchedule.forEach(item => {
            setTimeout(() => {
                fadeSpotMarker(marker, item.className);
                fadeSpotMarker(markerMirror, item.className);
            }, item.timeout);
        });

        setTimeout(() => {
            wsjtxStationsLayer.removeLayer(marker);
            wsjtxStationsLayer.removeLayer(markerMirror);
        }, 60000);
    }

    function clearWSJTXSpots() {
        wsjtxStationsLayer.clearLayers();
    }

    function setStaticMapTime(newDate) {
        staticMapTime = newDate;
        grayline.setTime(staticMapTime);
        grayline.redraw();
    }
  </script>

</body>
